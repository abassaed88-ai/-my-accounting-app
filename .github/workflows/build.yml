name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout Inventra
        uses: actions/checkout@v4
        with:
          repository: itswael/inventra
          ref: master
          path: inventra

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p inventra assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Inventra-APK
          path: inventra/app/build/outputs/apk/debug/*.apk
