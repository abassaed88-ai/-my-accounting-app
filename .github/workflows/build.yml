name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/goodgirl-palette-cleanup]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout Inventra
        uses: actions/checkout@v4
        with:
          repository: itswael/inventra
          ref: fd0f1be3e6aac72b91b2fd29d7eee03d193e55a3
          path: inventra

      - name: Customize accounting app
        run: python scripts/customize_inventra.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle -p inventra testDebugUnitTest

      - name: Build APK
        run: gradle -p inventra assembleDebug

      - name: Verify APK output
        run: |
          APK="inventra/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Inventra-APK
          path: inventra/app/build/outputs/apk/debug/*.apk
          retention-days: 90
